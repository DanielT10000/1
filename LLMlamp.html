```html <!DOCTYPE html> <html> <head> <title>Lava Lamp Simulation</title> <style> body { margin: 0; overflow: hidden; background-color: #1a1a1a; /* Dark background */ } canvas { display: block; } </style> </head> <body> <canvas id="lavaCanvas"></canvas> <script> const canvas = document.getElementById('lavaCanvas'); const ctx = canvas.getContext('2d'); canvas.width = window.innerWidth; canvas.height = window.innerHeight; let fluid = []; let numParticles = 100; function createFluid() { for (let i = 0; i < numParticles; i++) { fluid.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 10 + 2, color: '#' + Math.floor(Math.random()*16777215).toString(16), speedX: (Math.random() - 0.5) * 2, speedY: (Math.random() - 0.5) * 2, size: Math.random() * 5 + 2, alpha: Math.random() * 0.7 + 0.3, type: Math.random() < 0.3 ? 'lava' : 'water', trail: [] }); } } function updateFluid() { for (let i = 0; i < fluid.length; i++) { fluid[i].x += fluid[i].speedX; fluid[i].y += fluid[i].speedY; // Bounce off walls if (fluid[i].x + fluid[i].r > canvas.width || fluid[i].x - fluid[i].r < 0) { fluid[i].speedX = -fluid[i].speedX; } if (fluid[i].y + fluid[i].r > canvas.height || fluid[i].y - fluid[i].r < 0) { fluid[i].speedY = -fluid[i].speedY; } // Gravity effect fluid[i].speedY += 0.1; if (fluid[i].type === 'lava') { if(fluid[i].y > canvas.height * 0.9) { fluid[i].y = canvas.height * 0.9; fluid[i].speedY = -fluid[i].speedY * 0.8; // Slow down when reaching the top } } else if (fluid[i].type === 'water'){ if(fluid[i].y > canvas.height * 0.9) { fluid[i].y = canvas.height * 0.9; fluid[i].speedY = -fluid[i].speedY * 0.8; // Slow down when reaching the top } } // Trail effect (simplified) fluid[i].trail.push({x: fluid[i].x, y: fluid[i].y, color: fluid[i].color}); if(fluid[i].trail.length > 50){ fluid[i].trail.shift(); } //Particle Dissipation if (fluid[i].alpha < 0.1) { fluid.splice(fluid.indexOf(fluid[i]), 1); } } } function drawFluid() { ctx.beginPath(); for (let i = 0; i < fluid.length; i++) { ctx.arc(fluid[i].x, fluid[i].y, fluid[i].r, 0, 2 * Math.PI); ctx.fillStyle = fluid[i].color + 'a' + fluid[i].alpha; ctx.globalAlpha = fluid[i].alpha; ctx.fill(); if (fluid[i].trail.length > 0) { const trailAlpha = fluid[i].trail[0].alpha; ctx.strokeStyle = fluid[i].trail[0].color + 'a' + trailAlpha; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(fluid[i].trail[0].x, fluid[i].trail[0].y); for (let j = 1; j < fluid[i].trail.length; j++) { ctx.lineTo(fluid[i].trail[j].x, fluid[i].trail[j].y); } ctx.stroke(); } } } function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } function main() { createFluid(); window.addEventListener('resize', resizeCanvas); resizeCanvas(); requestAnimationFrame(animate); } function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); updateFluid(); drawFluid(); requestAnimationFrame(animate); } main(); </script> </body> </html> ```
