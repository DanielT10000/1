<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Homepage</title>
  
  <style>
    body {
      margin: 0;
      padding: 40px;
      background-color: #0f0f1a;
      color: #e0e0ff;
      font-family: system-ui, sans-serif;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 50px;
      color: #a5b4fc;
      font-size: 2.8rem;
    }
    
    .gallery {
      display: grid;
      /* This ensures cards stay a reasonable size and wrap automatically */
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .card {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background: #1e1e38;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: all 0.28s ease;
      aspect-ratio: 4 / 3;
    }
    
    .card:hover {
      transform: translateY(-12px) scale(1.04);
      box-shadow: 0 20px 50px rgba(80, 70, 220, 0.4);
    }
    
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    
    .card:hover img {
      transform: scale(1.08);
    }
    
    .card a {
      position: absolute;
      inset: 0;
      z-index: 2;
      text-decoration: none;
    }
    
    .label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      color: white;
      font-weight: 500;
      font-size: 1.1rem;
      text-align: center;
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }
    
    .card:hover .label {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <script>
    (async function() {
        const ua = navigator.userAgent;
        const vendor = navigator.vendor;
        
        // Kontrollera om webbläsaren utger sig för att vara Chrome/Chromium
        const isChromium = /Chrome/.test(ua) && /Google Inc/.test(vendor);
        
        // Filtrera bort kända Chromium-alternativ
        const isEdge = /Edg/.test(ua);
        const isOpera = /OPR/.test(ua) || /Opera/.test(ua);
        
        // Kontrollera specifikt för Brave
        let isBrave = false;
        if (navigator.brave && typeof navigator.brave.isBrave === 'function') {
            try {
                isBrave = await navigator.brave.isBrave();
            } catch (e) {
                console.error(e);
            }
        }

        // Om det är Chromium men varken Edge, Opera eller Brave -> Blockera
        if (isChromium && !isEdge && !isOpera && !isBrave) {
            document.body.innerHTML = `
              <div style="display:flex; height:80vh; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding: 20px;">
                <h1 style="color: #ff6b6b; font-size: 3rem; margin-bottom: 20px;">Åtkomst Nekad</h1>
                <p style="font-size: 1.3rem; color: #a5b4fc; max-width: 600px;">
                  Denna webbsida har blockerats för Google Chrome.<br> 
                  Vänligen använd <strong>Firefox</strong>, <strong>Brave</strong> eller <strong>Edge</strong> för att fortsätta.
                </p>
              </div>
            `;
        }
    })();
  </script>
