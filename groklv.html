<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lava Lamp Simulation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a1f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Background glow effect */
        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(255, 120, 0, 0.15) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
        }

        .lamp {
            position: relative;
            width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 0 80px rgba(255, 140, 0, 0.6));
        }

        /* Glass body */
        .glass {
            position: relative;
            width: 220px;
            height: 520px;
            background: linear-gradient(180deg, #0b1f3a 0%, #1a3a5e 40%, #1a3a5e 100%);
            border-radius: 120px 120px 60px 60px;
            border: 22px solid #222;
            overflow: hidden;
            box-shadow: 
                inset 0 0 80px rgba(255,255,255,0.25),
                inset 40px 0 60px rgba(0,0,0,0.6),
                0 0 60px rgba(255, 160, 40, 0.4),
                0 25px 40px rgba(0,0,0,0.5);
            z-index: 2;
        }

        /* Glass highlight */
        .glass::before {
            content: '';
            position: absolute;
            top: 0;
            left: 25px;
            width: 35px;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.08) 30%, transparent 70%);
            border-radius: 120px 120px 60px 60px;
            z-index: 3;
            pointer-events: none;
        }

        /* Lava blobs */
        .blob {
            position: absolute;
            border-radius: 45% 55% 60% 40%;
            filter: blur(8px);
            box-shadow: 0 0 35px 15px rgba(255, 120, 0, 0.8);
            animation: float linear infinite;
            z-index: 1;
        }

        /* Individual blob styles with different colors, sizes, speeds, and paths */
        .blob1 {
            width: 68px;
            height: 92px;
            background: radial-gradient(circle at 35% 25%, #ffeb3b, #ff8c00 60%, #f33);
            left: 28px;
            bottom: -90px;
            animation-duration: 17.5s;
            animation-delay: -1s;
            box-shadow: 0 0 40px 18px #ffaa00;
        }

        .blob2 {
            width: 52px;
            height: 105px;
            background: radial-gradient(circle at 40% 30%, #ffeb3b, #ff6600 65%, #e62);
            left: 95px;
            bottom: -110px;
            animation-duration: 23s;
            animation-delay: -8s;
            box-shadow: 0 0 35px 12px #ff7700;
        }

        .blob3 {
            width: 78px;
            height: 68px;
            background: radial-gradient(circle at 30% 35%, #ffeb3b, #ff5500 55%, #f40);
            left: 12px;
            bottom: -70px;
            animation-duration: 13.8s;
            animation-delay: -14s;
            box-shadow: 0 0 45px 20px #ff9900;
        }

        .blob4 {
            width: 45px;
            height: 88px;
            background: radial-gradient(circle at 45% 20%, #ffee55, #ff9900 60%, #f50);
            left: 135px;
            bottom: -95px;
            animation-duration: 19.2s;
            animation-delay: -3s;
            box-shadow: 0 0 32px 14px #ffbb00;
        }

        .blob5 {
            width: 64px;
            height: 79px;
            background: radial-gradient(circle at 25% 40%, #ffeb3b, #ff7733 70%, #f33);
            left: 68px;
            bottom: -80px;
            animation-duration: 15.5s;
            animation-delay: -11s;
            box-shadow: 0 0 38px 16px #ff8800;
        }

        .blob6 {
            width: 55px;
            height: 98px;
            background: radial-gradient(circle at 50% 25%, #ffeb3b, #ff6600 65%, #e72);
            left: 155px;
            bottom: -105px;
            animation-duration: 21s;
            animation-delay: -6s;
            box-shadow: 0 0 36px 15px #ffaa33;
        }

        /* The floating animation - wavy path with scale + slight rotation for organic lava feel */
        @keyframes float {
            0% {
                transform: translateY(0px) translateX(0px) scale(0.85) rotate(0deg);
            }
            20% {
                transform: translateY(-140px) translateX(18px) scale(1.15) rotate(12deg);
            }
            40% {
                transform: translateY(-260px) translateX(-22px) scale(1.25) rotate(-8deg);
            }
            60% {
                transform: translateY(-380px) translateX(15px) scale(1.05) rotate(15deg);
            }
            80% {
                transform: translateY(-460px) translateX(-12px) scale(0.9) rotate(-5deg);
            }
            100% {
                transform: translateY(-580px) translateX(8px) scale(0.75) rotate(0deg);
            }
        }

        /* Base / stand */
        .base {
            width: 140px;
            height: 48px;
            background: linear-gradient(#333, #1a1a1a);
            border-radius: 12px;
            margin-top: -8px;
            box-shadow: 
                0 10px 25px rgba(255, 120, 0, 0.7),
                inset 0 8px 15px rgba(255,255,255,0.2);
            position: relative;
            z-index: 1;
        }

        /* Heater glow */
        .base::before {
            content: '';
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 68px;
            height: 28px;
            background: radial-gradient(circle, #ffdd44 10%, #ff8800 60%, transparent 80%);
            border-radius: 50%;
            box-shadow: 0 0 40px 20px #ffaa00;
            z-index: -1;
        }

        /* Top cap */
        .cap {
            width: 88px;
            height: 28px;
            background: #222;
            border-radius: 50px 50px 0 0;
            margin-bottom: -12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            z-index: 3;
            position: relative;
        }

        /* Title */
        .title {
            position: absolute;
            bottom: -90px;
            font-family: 'Press Start 2P', system-ui;
            font-size: 18px;
            color: #ffaa33;
            text-shadow: 
                0 0 10px #ffaa33,
                0 0 20px #ff5500;
            letter-spacing: 4px;
            white-space: nowrap;
            pointer-events: none;
        }

        /* Small rising bubbles for extra realism */
        .bubble {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(255, 240, 180, 0.6);
            border-radius: 50%;
            filter: blur(1px);
            animation: bubble-rise 4s linear infinite;
            z-index: 2;
            box-shadow: 0 0 8px rgba(255, 240, 180, 0.8);
        }

        @keyframes bubble-rise {
            0% {
                opacity: 0;
                transform: translateY(100px);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-420px);
            }
        }
    </style>
</head>
<body>

    <div class="lamp">
        
        <!-- Top cap -->
        <div class="cap"></div>
        
        <!-- Glass body -->
        <div class="glass">
            
            <!-- Lava blobs -->
            <div class="blob blob1"></div>
            <div class="blob blob2"></div>
            <div class="blob blob3"></div>
            <div class="blob blob4"></div>
            <div class="blob blob5"></div>
            <div class="blob blob6"></div>

            <!-- Small rising bubbles (pure CSS) -->
            <div class="bubble" style="left: 45px; animation-duration: 3.2s; animation-delay: 0s; width: 6px; height: 6px;"></div>
            <div class="bubble" style="left: 110px; animation-duration: 4.8s; animation-delay: -1.2s;"></div>
            <div class="bubble" style="left: 72px; animation-duration: 2.9s; animation-delay: -2.5s; width: 4px; height: 4px;"></div>
            <div class="bubble" style="left: 145px; animation-duration: 3.7s; animation-delay: -0.8s;"></div>
            <div class="bubble" style="left: 28px; animation-duration: 5.1s; animation-delay: -3.1s; width: 7px; height: 7px;"></div>
            <div class="bubble" style="left: 165px; animation-duration: 2.6s; animation-delay: -1.8s; width: 5px; height: 5px;"></div>
            <div class="bubble" style="left: 88px; animation-duration: 4.3s; animation-delay: -2.9s;"></div>

        </div>
        
        <!-- Base with heater glow -->
        <div class="base"></div>

        <!-- Title -->
        <div class="title">LAVA LAMP</div>
        
    </div>

    <script>
        // Optional: Click the lamp to add a new random blob (fun interactivity)
        document.querySelector('.glass').addEventListener('click', function(e) {
            if (Math.random() > 0.6) {
                const newBlob = document.createElement('div');
                newBlob.classList.add('blob');
                
                // Random properties
                const colors = [
                    'radial-gradient(circle at 35% 25%, #ffeb3b, #ff8c00 60%, #f33)',
                    'radial-gradient(circle at 40% 30%, #ffeb3b, #ff6600 65%, #e62)',
                    'radial-gradient(circle at 30% 35%, #ffeb3b, #ff5500 55%, #f40)'
                ];
                
                newBlob.style.background = colors[Math.floor(Math.random() * colors.length)];
                newBlob.style.width = (45 + Math.random() * 35) + 'px';
                newBlob.style.height = (65 + Math.random() * 45) + 'px';
                newBlob.style.left = (20 + Math.random() * 140) + 'px';
                newBlob.style.bottom = '-80px';
                newBlob.style.animationDuration = (12 + Math.random() * 18) + 's';
                newBlob.style.animationDelay = '-' + Math.random() * 12 + 's';
                newBlob.style.boxShadow = '0 0 35px 15px rgba(255, 140, 0, 0.85)';
                
                this.appendChild(newBlob);
                
                // Remove it after one cycle so it doesn't pile up forever
                setTimeout(() => {
                    if (newBlob.parentNode) newBlob.parentNode.removeChild(newBlob);
                }, parseFloat(newBlob.style.animationDuration) * 1100);
            }
        });

        console.log('%c✅ Lava lamp ready! Click inside the glass to add more lava blobs.', 'color:#ffaa33; font-family:monospace;');
    </script>

</body>
</html>
