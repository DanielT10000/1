<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>God Jul!</title>
<style>
    body, html {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: white;
        position: relative;
    }

  
    #hilsen {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 9vw;
        min-font-size: 4rem;
        max-font-size: 12rem;
        font-weight: 900;
        color: #fff;
        text-align: center;
        text-shadow: 
            0 0 20px #ffcc00,
            0 0 40px #ff6600,
            0 0 60px #ff3366,
            0 0 80px #cc33ff;
        letter-spacing: 0.08em;
        z-index: 12;
        pointer-events: none;
        animation: pulse 4s ease-in-out infinite, sparkle 6s linear infinite;
        white-space: nowrap;
        user-select: none;
    }

    #hilsen::after {
        content: "!!!";
        font-size: 1.3em;
        vertical-align: super;
        color: #ffcc00;
        text-shadow: 0 0 25px #ffcc00;
    }

    @keyframes pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.92; }
        50%      { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
    }

    @keyframes sparkle {
        0%, 100% { filter: brightness(1) drop-shadow(0 0 20px #fff); }
        25%      { filter: brightness(1.4) drop-shadow(0 0 40px #ffcc00); }
        50%      { filter: brightness(1.2) drop-shadow(0 0 35px #ff3366); }
        75%      { filter: brightness(1.5) drop-shadow(0 0 45px #cc33ff); }
    }

    
    #chrome-block {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.95);
        z-index: 9999;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 30px;
        backdrop-filter: blur(8px);
    }
    #chrome-block h1 { font-size: 3.5rem; margin: 0 0 1rem; color: #ff4444; }
    #chrome-block p  { font-size: 1.6rem; max-width: 700px; line-height: 1.4; }

    
    .lights-container { position: fixed; inset: 0; pointer-events: none; z-index: 15; overflow: hidden; }
    .light-string { position: absolute; display: flex; gap: 18px; padding: 12px 0; }
    .light { width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 12px 4px currentColor; animation: twinkle 3s infinite; flex-shrink: 0; }
    .light:nth-child(odd)  { animation-duration: 2.4s; animation-delay: 0.0s; }
    .light:nth-child(even) { animation-duration: 3.1s; animation-delay: 0.7s; }
    .light:nth-child(3n)   { animation-duration: 1.8s; animation-delay: 1.2s; }
    .light:nth-child(4n)   { animation-duration: 4.2s; animation-delay: 0.4s; }
    .light:nth-child(5n)   { animation-duration: 2.9s; animation-delay: 1.6s; }
    .light:nth-child(6n+1) { color: #ff3366; }
    .light:nth-child(6n+2) { color: #33ff99; }
    .light:nth-child(6n+3) { color: #ffcc00; }
    .light:nth-child(6n+4) { color: #3366ff; }
    .light:nth-child(6n+5) { color: #ff6600; }
    .light:nth-child(6n)   { color: #cc33ff; }
    @keyframes twinkle { 0%,100% { opacity: 0.4; transform: scale(0.9); box-shadow: 0 0 8px 2px currentColor; } 50% { opacity: 1; transform: scale(1.3); box-shadow: 0 0 20px 10px currentColor; } }
    #top  { top: 0; left: 0; right: 0; justify-content: center; flex-wrap: wrap; }
    #left { top: 0; bottom: 0; left: 0; writing-mode: vertical-rl; transform: rotate(180deg); }
    #right { top: 0; bottom: 0; right: 0; writing-mode: vertical-rl; }

    
    .snow-container { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
    .snowflake { position: absolute; top: -10%; left: var(--left); width: var(--size); height: var(--size); opacity: var(--opacity); animation: fall calc(var(--duration) * 1s) linear infinite, drift 12s ease-in-out infinite alternate; transform: rotate(var(--rotate)); will-change: transform, opacity; }
    .snowflake svg { width: 100%; height: 100%; filter: drop-shadow(0 0 4px rgba(255,255,255,0.9)); }
    @keyframes fall { to { transform: translateY(120vh); } }
    @keyframes drift { from { transform: translateX(-30px) rotate(var(--rotate)); } to { transform: translateX(40px) rotate(calc(var(--rotate) + 360deg)); } }

    
    .ginger { position:fixed; top:-100px; pointer-events:none; z-index:8; animation:fall linear infinite; }
    .ginger img { width:55px; height:auto; filter:drop-shadow(0 0 10px #ffcc00); }

    
    .bouncing { position:fixed; z-index:7; width:130px; height:auto; }

    
    .hint { 
        position: fixed; 
        bottom: 20px; 
        left: 50%; 
        transform: translateX(-50%); 
        color: rgba(255,255,255,0.7); 
        font-size: 1rem; 
        z-index: 20; 
        pointer-events: none; 
        text-shadow: 0 0 6px #000; 
    }
</style>
</head>
<body>


<div id="chrome-block">
    <h1>🚫 Google Chrome oppdaget</h1>
    <p>Denne opplevelsen støttes dessverre ikke i Google Chrome av kompatibilitetsårsaker.<br><br>
    Vennligst åpne denne siden i <strong>Microsoft Edge</strong>, <strong>Brave</strong>, <strong>Firefox</strong>, Opera eller en annen nettleser.</p>
</div>


<div class="lights-container">
    <div class="light-string" id="top"></div>
    <div class="light-string" id="left"></div>
    <div class="light-string" id="right"></div>
</div>


<div class="snow-container" id="snow"></div>


<div id="hilsen">God Jul</div>


<audio id="bgAudio" loop autoplay muted playsinline>
    <source src="JingleBells.mp3" type="audio/mpeg">
</audio>

<script>

function isGoogleChromeOnly() {
    const ua = navigator.userAgent;
    return /Chrome/.test(ua) && !/Edg\//.test(ua) && !/OPR\//.test(ua) && !/Brave/.test(ua) && !/Vivaldi/.test(ua);
}
if (isGoogleChromeOnly()) {
    document.getElementById('chrome-block').style.display = 'flex';
}


const snowContainer = document.getElementById('snow');

function createSnowflake() {
    const flake = document.createElement('div');
    flake.className = 'snowflake';

    const size = 18 + Math.random() * 42;
    const left = Math.random() * 100;
    const duration = 12 + Math.random() * 28;
    const opacity = 0.6 + Math.random() * 0.4;
    const rotate = Math.random() * 360 + 'deg';

    flake.style.setProperty('--size', size + 'px');
    flake.style.setProperty('--left', left + '%');
    flake.style.setProperty('--duration', duration);
    flake.style.setProperty('--opacity', opacity);
    flake.style.setProperty('--rotate', rotate);

    flake.innerHTML = `
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 0 L50 100 M0 50 L100 50 M25 25 L75 75 M25 75 L75 25 
                     M12.5 37.5 L37.5 12.5 M62.5 12.5 L87.5 37.5 
                     M12.5 62.5 L37.5 87.5 M62.5 87.5 L87.5 62.5" 
                  stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
            <circle cx="50" cy="50" r="8" fill="white" opacity="0.7"/>
        </svg>`;

    snowContainer.appendChild(flake);
    flake.addEventListener('animationend', () => flake.remove());
}

function spawnSnow() {
    createSnowflake();
    setTimeout(spawnSnow, 180 + Math.random() * 220);
}

spawnSnow();


for (let i = 0; i < 35; i++) {
    const flake = document.createElement('div');
    flake.className = 'snowflake';
    const size = 18 + Math.random() * 42;
    const left = Math.random() * 100;
    const duration = 12 + Math.random() * 28;
    const opacity = 0.6 + Math.random() * 0.4;
    const rotate = Math.random() * 360 + 'deg';

    flake.style.setProperty('--size', size + 'px');
    flake.style.setProperty('--left', left + '%');
    flake.style.setProperty('--duration', duration);
    flake.style.setProperty('--opacity', opacity);
    flake.style.setProperty('--rotate', rotate);

    flake.innerHTML = flake.innerHTML = `
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 0 L50 100 M0 50 L100 50 M25 25 L75 75 M25 75 L75 25 
                     M12.5 37.5 L37.5 12.5 M62.5 12.5 L87.5 37.5 
                     M12.5 62.5 L37.5 87.5 M62.5 87.5 L87.5 62.5" 
                  stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
            <circle cx="50" cy="50" r="8" fill="white" opacity="0.7"/>
        </svg>`;

    flake.style.top = (Math.random() * -80 - 20) + 'vh';
    snowContainer.appendChild(flake);
}


function createLights(count = 60) {
    const colors = ['#ff3366','#33ff99','#ffcc00','#3366ff','#ff6600','#cc33ff'];
    const conts = [document.getElementById('top'), document.getElementById('left'), document.getElementById('right')];
    conts.forEach(c => {
        for (let i = 0; i < count; i++) {
            const bulb = document.createElement('div');
            bulb.className = 'light';
            bulb.style.color = colors[Math.floor(Math.random() * colors.length)];
            bulb.style.animationDelay = Math.random() * 4 + 's';
            c.appendChild(bulb);
        }
    });
}
createLights();


function createGingerRain(count) {
    for (let i = 0; i < count; i++) {
        const div = document.createElement('div');
        div.className = 'ginger';
        div.style.left = Math.random() * 100 + '%';
        const size = 40 + Math.random() * 70;
        div.innerHTML = `<img src="pepparkaka.png" style="width:${size}px;">`;
        div.style.animationDuration = (14 + Math.random() * 20) + 's';
        div.style.animationDelay = Math.random() * -12 + 's';
        document.body.appendChild(div);
    }
}
createGingerRain(20);


const bouncers = [
    { el: null, x: 80,  y: 120, vx:  2.4, vy: 3.1, img: "lars.png" },
    { el: null, x: 600, y: 180, vx: -3.2, vy: 2.6, img: "lars.png" }
];
bouncers.forEach(b => {
    b.el = document.createElement('img');
    b.el.src = b.img;
    b.el.className = 'bouncing';
    document.body.appendChild(b.el);
});

function animateBouncers() {
    bouncers.forEach(b => {
        b.x += b.vx; b.y += b.vy;
        const r = b.el.getBoundingClientRect();
        if (b.x <= 0 || b.x + r.width >= innerWidth)  b.vx *= -1;
        if (b.y <= 0 || b.y + r.height >= innerHeight) b.vy *= -1;
        b.el.style.left = b.x + 'px';
        b.el.style.top  = b.y + 'px';
    });
    requestAnimationFrame(animateBouncers);
}
animateBouncers();


document.body.addEventListener('click', () => {
    const audio = document.getElementById('bgAudio');
    if (audio.muted) {
        audio.muted = false;
        audio.play().catch(()=>{});
    }
}, { once: true });
</script>

<div class="hint">Klikk hvor som helst for å aktivere lyd • Best opplevelse i Edge / Brave / Firefox</div>

</body>
</html>
